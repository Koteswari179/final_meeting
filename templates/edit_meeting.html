{% extends 'base.html' %}
{% load static %}

{% block subject %}Edit Meeting{% endblock %}

{% block content %}
<div class="edit-wrapper">
  <div class="edit-card shadow-lg">
    <h2 class="text-center text-primary mb-4">
      <i class="fas fa-pen-to-square"></i> Edit Meeting
    </h2>

    <form method="POST">
      {% csrf_token %}
      <div class="form-fields">
        {{ form.as_p }}
      </div>

      <div class="button-row mt-4">
        <button type="submit" class="btn btn-success btn-action">
          <i class="fas fa-save"></i> Save
        </button>
        <a href="{% url 'meetings_list' %}" class="btn btn-secondary btn-action">
          <i class="fas fa-times-circle"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  body {
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
    font-family: "Poppins", sans-serif;
  }

  .edit-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .edit-card {
    background: #fff;
    border-radius: 18px;
    padding: 35px 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .edit-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.15);
  }

  h2 {
    font-weight: 600;
  }

  h2 i {
    color: #007bff;
    margin-right: 6px;
  }

  label {
    font-weight: 500;
    margin-bottom: 5px;
    color: #333;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #007bff;
    box-shadow: 0 0 6px rgba(0, 123, 255, 0.25);
    outline: none;
  }

  /* --- Buttons --- */
  .button-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
  }

  .btn-action {
    font-weight: 500;
    border-radius: 8px;
    padding: 8px 25px;
    font-size: 14px;
    transition: all 0.3s ease;
  }

  .btn-success {
    background-color: #198754;
    border: none;
  }

  .btn-success:hover {
    background-color: #157347;
    transform: translateY(-2px);
  }

  .btn-secondary {
    background-color: #6c757d;
    border: none;
  }

  .btn-secondary:hover {
    background-color: #5c636a;
    transform: translateY(-2px);
  }

  /* --- Mobile Adjustments --- */
  @media (max-width: 576px) {
    .edit-card {
      padding: 25px 20px;
    }

    .button-row {
      flex-direction: column;
      gap: 10px;
    }

    .btn-action {
      width: 100%;
    }

    h2 {
      font-size: 20px;
    }
  }
</style>
{% endblock %}
